name: YouTube playlist to Telegram

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: YouTube playlist URL (leave blank to use PLAYLIST_URL secret)
        required: false
        type: string
      destination:
        description: Telegram destination
        required: false
        default: channel
        type: choice
        options:
          - channel
          - group
          - custom
      rtmp_url:
        description: Custom RTMP URL (only for the custom destination)
        required: false
        type: string
      stream_quality:
        description: Output profile
        required: false
        default: balanced
        type: choice
        options:
          - economy
          - balanced
          - high
      proxy_url:
        description: Optional proxy URL
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: youtube-telegram-stream
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install streaming tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pip
          python3 -m pip install --user --upgrade --break-system-packages yt-dlp yt-dlp-ejs
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify streaming tools
        shell: bash
        run: |
          set -euo pipefail
          yt-dlp --version
          ffmpeg -version >/dev/null
          node --version

      - name: Start stream
        shell: bash
        env:
          PLAYLIST_URL: ${{ inputs.playlist_url || secrets.PLAYLIST_URL }}
          DESTINATION: ${{ inputs.destination || 'channel' }}
          STREAM_QUALITY: ${{ inputs.stream_quality || 'balanced' }}
          RTMP_URL: ${{ inputs.rtmp_url || ((inputs.destination || 'channel') == 'group' && secrets.GSTREAM_RTMPS_URL || secrets.CSTREAM_RTMPS_URL) }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          PROXY_URL: ${{ inputs.proxy_url || secrets.PROXY_URL }}
          POT_BASE_URL: ${{ secrets.POT_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ "$DESTINATION" == "custom" && -z "${{ inputs.rtmp_url }}" ]]; then
            echo "A custom destination requires the rtmp_url input." >&2
            exit 1
          fi
          test -n "$PLAYLIST_URL" || { echo "Missing playlist URL." >&2; exit 1; }
          test -n "$RTMP_URL" || { echo "Missing RTMP destination." >&2; exit 1; }
          python3 stream.py
