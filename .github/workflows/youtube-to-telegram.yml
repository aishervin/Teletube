name: YouTube playlist to Telegram

on:
  workflow_dispatch:
  schedule:
    # GitHub-hosted jobs have a six-hour limit. Restart shortly after each run.
    - cron: "0 */6 * * *"

concurrency:
  group: youtube-telegram-stream
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install streaming tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pip
          python3 -m pip install --user --upgrade --break-system-packages yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify streaming tools
        shell: bash
        run: |
          set -euo pipefail
          yt-dlp --version
          ffmpeg -version >/dev/null
          echo "ffmpeg is ready"
          node --version

      - name: Start stream
        shell: bash
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
          RTMP_URL: ${{ secrets.RTMP_URL }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          POT_BASE_URL: ${{ secrets.POT_BASE_URL }}
        run: |
          set -euo pipefail

          test -n "$PLAYLIST_URL" || {
            echo "Missing required secret: PLAYLIST_URL" >&2
            exit 1
          }
          test -n "$RTMP_URL" || {
            echo "Missing required secret: RTMP_URL" >&2
            exit 1
          }

          node worker.js
