name: Deploy control panel to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - panel/**
      - .github/workflows/deploy-panel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Publish panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy panel --project-name teletube-panel
